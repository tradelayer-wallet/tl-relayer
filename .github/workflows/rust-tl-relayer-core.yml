name: Rust relayer core
on:
  pull_request:
    paths: ['rust/tl-relayer-core/**', '.github/workflows/rust-tl-relayer-core.yml']
  push:
    branches: [main]
    paths: ['rust/tl-relayer-core/**', '.github/workflows/rust-tl-relayer-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch pinned crates
        working-directory: rust/tl-relayer-core
        run: cargo fetch --locked
      - name: Unit and integration tests
        working-directory: rust/tl-relayer-core
        run: cargo test --locked --offline
      - name: Legacy parity oracle is reproducible
        working-directory: rust/tl-relayer-core
        run: |
          node --version
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 22 ]; then
            echo "::warning::node < 22 cannot strip TypeScript types; parity regeneration skipped (the committed fixture is still replayed by cargo test)"
            exit 0
          fi
          node --experimental-strip-types scripts/compare-legacy.cjs --legacy "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/legacy-parity.json"
          diff -u fixtures/legacy-parity.json "$RUNNER_TEMP/legacy-parity.json"
      - name: Clippy
        working-directory: rust/tl-relayer-core
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Format
        working-directory: rust/tl-relayer-core
        run: cargo fmt --all -- --check
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs
        working-directory: rust/tl-relayer-core/lean
        run: lake build
      - name: Reject sorry/admit
        working-directory: rust/tl-relayer-core/lean
        run: "! grep -rnE '(^|[^A-Za-z_.])sorry([^A-Za-z_]|$)|^[[:space:]]*admit[[:space:]]*$' --include=*.lean ."
      - name: Axiom audit
        working-directory: rust/tl-relayer-core/lean
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          ! grep -q sorryAx axioms.txt
